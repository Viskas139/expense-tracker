<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер кишенькових витрат</title>
    <!-- Підключення шрифту Inter з Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>Трекер витрат</h1>
    </header>

    <div class="layout-container">
        <aside class="sidebar-balance">
            <h2 class="balance-title">Підсумковий баланс</h2>
            <p class="balance-amount">+1850 грн</p>
            <span class="balance-status status--positive">Бюджет у нормі</span>
        </aside>

        <main>
            <section id="add-transaction">
                <h2>Додати операцію</h2>
                
                <!-- Крок 1 (Лаба 8): Форма додавання операції за Варіантом 17 -->
                <form id="add-transaction-form" class="transaction-form">
                    <div class="form-group">
                        <label for="amount">Сума (грн):</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required placeholder="Наприклад, 100">
                    </div>
                    <div class="form-group">
                        <label for="type">Тип операції:</label>
                        <select id="type" name="type" required>
                            <option value="дохід">дохід</option>
                            <option value="витрата">витрата</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Категорія:</label>
                        <input type="text" id="category" name="category" required placeholder="Наприклад, Транспорт">
                    </div>
                    <button type="submit" class="submit-btn">Додати</button>
                </form>

            </section>

            <section id="transactions-list">
                <h2>Останні операції</h2>
                <div class="api-controls">
                     <button id="reload-btn" type="button" class="submit-btn">Оновити дані з API</button>
                    <p id="loading-status" style="display: none; color: #666; margin-top: 10px;">Завантаження даних...</p>
                    <p id="error-message" style="display: none; color: #e74c3c; margin-top: 10px; font-weight: bold;"></p>
                </div>
                
                <div class="cards">
                    <article class="transaction-card">
                        <div class="card-header">
                            <span class="category-badge badge--transport">Транспорт</span>
                            <span class="amount amount--expense">-150 грн</span>
                        </div>
                        <h3 class="card-title">Оплата за залізничний квиток</h3>
                    </article>

                    <article class="transaction-card">
                        <div class="card-header">
                            <span class="category-badge badge--income">Дохід</span>
                            <span class="amount amount--income">+2000 грн</span>
                        </div>
                        <h3 class="card-title">Кишенькові гроші</h3>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <p>Автор: Ліщенко Вікторія. 2026</p>
    </footer>

</body>
</html>
