<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер кишенькових витрат</title>
    <!-- Підключення шрифту Inter з Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <h1>Трекер витрат</h1>
    </header>

    <div class="layout-container">
        <aside class="sidebar-balance">
            <h2 class="balance-title">Підсумковий баланс</h2>
            <p class="balance-amount">+1850 грн</p>
            <span class="balance-status status--positive">Бюджет у нормі</span>
        </aside>

        <main>
            <section id="add-transaction">
                <h2>Додати операцію</h2>
                <form action="#" class="transaction-form">
                    <div class="form-group">
                        <label for="transaction-title">Назва операції:</label>
                        <input type="text" id="transaction-title" name="title" required placeholder="Наприклад, Проїзний">
                    </div>
                    <div class="form-group">
                        <label for="transaction-amount">Сума (грн):</label>
                        <input type="number" id="transaction-amount" name="amount" required placeholder="100 або -50">
                    </div>
                    <div class="form-group">
                        <label for="transaction-category">Категорія:</label>
                        <select id="transaction-category" name="category">
                            <option value="transport">Транспорт</option>
                            <option value="food">Їжа</option>
                            <option value="entertainment">Розваги</option>
                            <option value="income">Дохід</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">Додати</button>
                </form>
            </section>

            <section id="transactions-list">
                <h2>Останні операції</h2>
                <div class="cards">
                    <article class="transaction-card">
                        <div class="card-header">
                            <span class="category-badge badge--transport">Транспорт</span>
                            <span class="amount amount--expense">-150 грн</span>
                        </div>
                        <h3 class="card-title">Оплата за залізничний квиток</h3>
                    </article>

                    <article class="transaction-card">
                        <div class="card-header">
                            <span class="category-badge badge--income">Дохід</span>
                            <span class="amount amount--income">+2000 грн</span>
                        </div>
                        <h3 class="card-title">Кишенькові гроші</h3>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <p>Автор: Ліщенко Вікторія. 2026</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
